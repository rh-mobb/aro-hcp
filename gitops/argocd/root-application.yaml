# Template rendered by scripts/gitops-bootstrap.sh (GITOPS_REPO, GITOPS_REVISION, path).
# Not included in Kustomize overlays so a feature-branch bootstrap is not reverted to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  project: default
  source:
    repoURL: https://github.com/rh-mobb/aro-hcp.git
    targetRevision: main
    path: gitops/overlays/public
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
