# Template rendered by scripts/gitops-bootstrap.sh (GITOPS_REPO, GITOPS_REVISION, path).
# Not included in Kustomize overlays so a feature-branch bootstrap is not reverted to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  project: default
  source:
    repoURL: https://github.com/rh-mobb/validated-pattern-aro-hcp.git
    targetRevision: main
    path: gitops/overlays/public
  destination:
    server: https://kubernetes.default.svc
  # Default GitOps controller may get/list/watch ServiceAccounts but not patch
  # them. OpenShift adds dockercfg secrets; the metadata Job stamps WI
  # annotations. Ignore those fields so selfHeal does not fail (and would not
  # wipe azure.workload.identity/* if patch were allowed).
  ignoreDifferences:
    - kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
        - /secrets
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
