apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-from-metadata
  namespace: external-secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-from-metadata
  namespace: external-secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["external-secrets-sa"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-from-metadata
  namespace: external-secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-from-metadata
subjects:
  - kind: ServiceAccount
    name: eso-from-metadata
    namespace: external-secrets-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-from-metadata-read
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aro-platform-metadata"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-from-metadata-read
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-from-metadata-read
subjects:
  - kind: ServiceAccount
    name: eso-from-metadata
    namespace: external-secrets-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-from-metadata
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["externalsecretsconfigs"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["clustersecretstores"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-from-metadata
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-from-metadata
subjects:
  - kind: ServiceAccount
    name: eso-from-metadata
    namespace: external-secrets-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-from-metadata
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-from-metadata
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-from-metadata
subjects:
  - kind: ServiceAccount
    name: eso-from-metadata
    namespace: external-secrets-operator
---
# Default GitOps controller ClusterRole cannot create Jobs (only get/list/watch
# on *). The eso-from-metadata Sync hook lives in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-eso-hooks
  namespace: external-secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-eso-hooks
  namespace: external-secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-eso-hooks
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
